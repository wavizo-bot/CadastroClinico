    apply plugin: 'com.android.application'

// Credenciais do keystore: lidas de android/keystore.properties (NAO versionado,
// ver .gitignore) ou de variaveis de ambiente (CI). NUNCA hardcodar no build.gradle
// — regras 3.1 / GH1.3 (o repo e publico).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }
def ksStoreFile = keystoreProps.getProperty('storeFile') ?: System.getenv('CADCLINICO_STORE_FILE') ?: 'keystore/cadclinico-upload.keystore'
def ksStorePassword = keystoreProps.getProperty('storePassword') ?: System.getenv('CADCLINICO_STORE_PASSWORD')
def ksKeyAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('CADCLINICO_KEY_ALIAS') ?: 'cadclinico-upload'
def ksKeyPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('CADCLINICO_KEY_PASSWORD')

// Upload signing for Google Play (keystore under android/keystore)
android {
    signingConfigs {
        release {
            // CHAVE DE UPLOAD DO CADASTRO CLINICO (SHA1 BE:FA:A2:26:67:A5:B6:81:7E:
            // C6:61:AB:8A:86:68:B9:C1:2C:62:E4) - e ESTA chave que o Play exige no
            // slot do Cadastro Clinico. A do Acompanha Digital (SHA1 F1:D4:...) e
            // OUTRA: em 15/10/2026 este AAB foi parar no slot errado (do Acompanha)
            // e o Play rejeitou exigindo o F1:D4. Nunca trocar a chave deste projeto.
            storeFile rootProject.file(ksStoreFile)
            storePassword ksStorePassword
            keyAlias ksKeyAlias
            keyPassword ksKeyPassword
        }
    }
    namespace = "com.cadclinico.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cadclinico.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "1.0.16"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // .gz precisa ir SEM compressão extra: o WebView do Capacitor não
            // serve asset .gz comprimido pelo aapt (traineddata do OCR).
            noCompress 'gz'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            // proguard-android-optimize.txt (e NAO proguard-android.txt): ativa as
            // otimizacoes reais de codigo DEX (inlining, -allowaccessmodification,
            // etc.) alem da ofuscacao/reducao. E o que o alerta "OTIMIZACAO DEX"
            // do Play Console exige (ver log.txt 15/10/2026 e proguard-rules.pro).
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
